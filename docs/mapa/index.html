<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Higiofi · Mapa Cádiz</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>

<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  #map { flex: 1 1 auto; }

  /* Pills (filtros) reutilizando convención del dashboard licitaciones */
  .pill { padding: .35rem .8rem; border-radius: 9999px; font-size: .8rem; font-weight: 500; cursor: pointer; user-select: none; transition: all .15s; border: 1px solid transparent; white-space: nowrap; }
  .pill-off { background-color: white; color: #475569; border-color: #e2e8f0; }
  .pill-off:hover { background-color: #f8fafc; }
  .pill-on  { background-color: #0f172a; color: white; border-color: #0f172a; }
  .dark .pill-off { background-color: #1e293b; color: #cbd5e1; border-color: #334155; }
  .dark .pill-off:hover { background-color: #334155; }
  .dark .pill-on  { background-color: #f1f5f9; color: #0f172a; border-color: #f1f5f9; }

  /* Pills coloreados por tipo de cliente (mismo patrón enc-alto/medio del dashboard) */
  .tipo-colegio_publico.pill-off    { background:#e0e7ff; color:#3730a3; border-color:#c7d2fe; }
  .tipo-colegio_publico.pill-on     { background:#6366f1; color:white; border-color:#6366f1; box-shadow:0 0 0 2px rgba(99,102,241,.35); }
  .tipo-colegio_privado.pill-off    { background:#fce7f3; color:#9d174d; border-color:#fbcfe8; }
  .tipo-colegio_privado.pill-on     { background:#ec4899; color:white; border-color:#ec4899; box-shadow:0 0 0 2px rgba(236,72,153,.35); }
  .tipo-guarderia.pill-off          { background:#fef3c7; color:#92400e; border-color:#fde68a; }
  .tipo-guarderia.pill-on           { background:#f59e0b; color:white; border-color:#f59e0b; box-shadow:0 0 0 2px rgba(245,158,11,.35); }
  .tipo-ayuntamiento.pill-off       { background:#dcfce7; color:#166534; border-color:#bbf7d0; }
  .tipo-ayuntamiento.pill-on        { background:#16a34a; color:white; border-color:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,.35); }
  .tipo-camping.pill-off            { background:#ccfbf1; color:#115e59; border-color:#99f6e4; }
  .tipo-camping.pill-on             { background:#14b8a6; color:white; border-color:#14b8a6; box-shadow:0 0 0 2px rgba(20,184,166,.35); }
  .tipo-paisajista.pill-off         { background:#fee2e2; color:#991b1b; border-color:#fecaca; }
  .tipo-paisajista.pill-on          { background:#dc2626; color:white; border-color:#dc2626; box-shadow:0 0 0 2px rgba(220,38,38,.35); }

  /* Pills coloreados por estado interno */
  .estado-sin.pill-off       { background:#e0e7ff; color:#3730a3; border-color:#c7d2fe; }
  .estado-sin.pill-on        { background:#6366f1; color:white; border-color:#6366f1; }
  .estado-contactado.pill-off { background:#fef3c7; color:#92400e; border-color:#fde68a; }
  .estado-contactado.pill-on  { background:#f59e0b; color:white; border-color:#f59e0b; }
  .estado-oferta.pill-off    { background:#cffafe; color:#155e75; border-color:#a5f3fc; }
  .estado-oferta.pill-on     { background:#06b6d4; color:white; border-color:#06b6d4; }
  .estado-cliente.pill-off   { background:#dcfce7; color:#166534; border-color:#bbf7d0; }
  .estado-cliente.pill-on    { background:#16a34a; color:white; border-color:#16a34a; }
  .estado-descartado.pill-off { background:#fee2e2; color:#991b1b; border-color:#fecaca; }
  .estado-descartado.pill-on  { background:#dc2626; color:white; border-color:#dc2626; }

  /* Marker divIcon coloreado por tipo */
  .h-marker {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
    border: 2px solid white;
  }
  .h-marker-colegio_publico  { background:#6366f1; }
  .h-marker-colegio_privado  { background:#ec4899; }
  .h-marker-guarderia        { background:#f59e0b; }
  .h-marker-ayuntamiento     { background:#16a34a; }
  .h-marker-camping          { background:#14b8a6; }
  .h-marker-paisajista       { background:#dc2626; }

  /* Marcador con estado "cliente" o "descartado" muestra ring */
  .h-marker.ring-cliente    { box-shadow: 0 1px 4px rgba(0,0,0,.4), 0 0 0 3px #16a34a; }
  .h-marker.ring-descartado { box-shadow: 0 1px 4px rgba(0,0,0,.4), 0 0 0 3px #dc2626; opacity:.55; }
  .h-marker.ring-oferta     { box-shadow: 0 1px 4px rgba(0,0,0,.4), 0 0 0 3px #06b6d4; }
  .h-marker.ring-contactado { box-shadow: 0 1px 4px rgba(0,0,0,.4), 0 0 0 3px #f59e0b; }

  /* Popup: estilo limpio y táctil */
  .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; }
  .leaflet-popup-content { margin: 0; width: 300px !important; }
  .dark .leaflet-popup-content-wrapper, .dark .leaflet-popup-tip { background:#1e293b; color:#f1f5f9; }
  .popup-section { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
  .dark .popup-section { border-bottom-color:#334155; }
  .popup-section:last-child { border-bottom: none; }

  /* Filas de contacto: muestran el dato real y son tappables */
  .contact-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    text-decoration: none; color: inherit;
    transition: background .15s;
    min-height: 42px;
  }
  .contact-row:hover { background: #f1f5f9; }
  .dark .contact-row:hover { background: #334155; }
  .contact-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .contact-icon-tel   { background:#dcfce7; color:#166534; }
  .contact-icon-email { background:#dbeafe; color:#1e40af; }
  .contact-icon-maps  { background:#fef3c7; color:#92400e; }
  .contact-icon-web   { background:#e0e7ff; color:#3730a3; }
  .dark .contact-icon-tel   { background:rgba(22,163,74,.25); color:#86efac; }
  .dark .contact-icon-email { background:rgba(30,64,175,.25); color:#93c5fd; }
  .dark .contact-icon-maps  { background:rgba(245,158,11,.25); color:#fcd34d; }
  .dark .contact-icon-web   { background:rgba(99,102,241,.25); color:#c7d2fe; }
  .contact-text {
    font-size: 13px; color: #0f172a;
    flex: 1; min-width: 0; word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .dark .contact-text { color: #f1f5f9; }
  .contact-arrow { color: #94a3b8; flex-shrink: 0; }

  /* Filtros bar: scroll horizontal en móvil sin scrollbar visible */
  .scroll-x { overflow-x: auto; scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }

  /* FAB ubicación */
  .fab {
    position: absolute; bottom: 24px; right: 16px; z-index: 1000;
    width: 52px; height: 52px; border-radius: 50%;
    background:#0f172a; color:white; border:none;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }
  .dark .fab { background:#f1f5f9; color:#0f172a; }

  /* KPIs compactos */
  .kpi-num { font-variant-numeric: tabular-nums; font-weight: 700; }

  /* Cluster pequeño/medio/grande: alineamos colores con la paleta del proyecto */
  .marker-cluster-small      { background-color: rgba(99,102,241,.5); }
  .marker-cluster-small div  { background-color: rgba(99,102,241,.85); color:white; }
  .marker-cluster-medium     { background-color: rgba(245,158,11,.5); }
  .marker-cluster-medium div { background-color: rgba(245,158,11,.85); color:white; }
  .marker-cluster-large      { background-color: rgba(220,38,38,.5); }
  .marker-cluster-large div  { background-color: rgba(220,38,38,.85); color:white; }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col h-screen overflow-hidden">

<!-- ============================================================ HEADER -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
  <div class="px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="min-w-0">
        <h1 class="text-lg font-bold leading-tight">Higiofi · Mapa Cádiz</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 truncate" id="kpi-resumen">cargando…</p>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button id="btn-licitaciones" title="Volver al dashboard de licitaciones"
              class="p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      </button>
      <button id="btn-dark" title="Modo oscuro" class="p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>
    </div>
  </div>

  <!-- Búsqueda -->
  <div class="px-4 pb-3">
    <div class="relative">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
      <input id="busqueda" type="search" placeholder="Buscar colegio, ayuntamiento, municipio…"
             class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>
  </div>

  <!-- Filtros por tipo -->
  <div class="px-4 pb-2 scroll-x flex gap-2">
    <span class="text-xs uppercase tracking-wide text-slate-400 self-center mr-1">Tipo:</span>
    <button class="pill tipo-colegio_publico pill-on"  data-filtro-tipo="colegio_publico">Colegios públicos <span class="opacity-70" data-count-tipo="colegio_publico"></span></button>
    <button class="pill tipo-colegio_privado pill-on"  data-filtro-tipo="colegio_privado">Colegios privados <span class="opacity-70" data-count-tipo="colegio_privado"></span></button>
    <button class="pill tipo-guarderia pill-on"        data-filtro-tipo="guarderia">Guarderías <span class="opacity-70" data-count-tipo="guarderia"></span></button>
    <button class="pill tipo-ayuntamiento pill-on"     data-filtro-tipo="ayuntamiento">Ayuntamientos <span class="opacity-70" data-count-tipo="ayuntamiento"></span></button>
    <button class="pill tipo-camping pill-on"          data-filtro-tipo="camping">Campings <span class="opacity-70" data-count-tipo="camping"></span></button>
    <button class="pill tipo-paisajista pill-on"       data-filtro-tipo="paisajista">Paisajistas / obra civil <span class="opacity-70" data-count-tipo="paisajista"></span></button>
  </div>

  <!-- Filtros por estado -->
  <div class="px-4 pb-3 scroll-x flex gap-2">
    <span class="text-xs uppercase tracking-wide text-slate-400 self-center mr-1">Estado:</span>
    <button class="pill estado-sin pill-on"         data-filtro-estado="sin">Sin contactar</button>
    <button class="pill estado-contactado pill-on"  data-filtro-estado="contactado">Contactado</button>
    <button class="pill estado-oferta pill-on"      data-filtro-estado="oferta">Oferta enviada</button>
    <button class="pill estado-cliente pill-on"     data-filtro-estado="cliente">Cliente</button>
    <button class="pill estado-descartado pill-off" data-filtro-estado="descartado">Descartado</button>
  </div>
</header>

<!-- ============================================================ MAPA -->
<div id="map" class="relative"></div>

<button id="fab-locate" class="fab" title="Mostrar mi ubicación">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v8m-4-4h8m4 0a8 8 0 11-16 0 8 8 0 0116 0z"/></svg>
</button>

<!-- ============================================================ SCRIPTS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
'use strict';

// ============================ Constantes =====================================
const TIPO_LABELS = {
  colegio_publico:  'Colegio público',
  colegio_privado:  'Colegio privado',
  guarderia:        'Guardería',
  ayuntamiento:     'Ayuntamiento',
  camping:          'Camping',
  paisajista:       'Paisajista / obra civil',
};

const TIPO_ICONO_LETRA = {
  colegio_publico:  'P',
  colegio_privado:  'V',
  guarderia:        'G',
  ayuntamiento:     'A',
  camping:          'C',
  paisajista:       'J',
};

const ESTADOS = [
  { key: 'sin',        label: 'Sin contactar',    color: '#6366f1', clase: 'estado-sin' },
  { key: 'contactado', label: 'Contactado',       color: '#f59e0b', clase: 'estado-contactado' },
  { key: 'oferta',     label: 'Oferta enviada',   color: '#06b6d4', clase: 'estado-oferta' },
  { key: 'cliente',    label: 'Cliente',          color: '#16a34a', clase: 'estado-cliente' },
  { key: 'descartado', label: 'Descartado',       color: '#dc2626', clase: 'estado-descartado' },
];

const STORAGE_PREFIX = 'higiofi-mapa-v1';
const KEY_DARK     = `${STORAGE_PREFIX}-dark`;
const KEY_ESTADO   = (id) => `${STORAGE_PREFIX}-estado-${id}`;
const KEY_NOTAS    = (id) => `${STORAGE_PREFIX}-notas-${id}`;

// ============================ Estado interno (localStorage) ==================
function getEstado(id) { return localStorage.getItem(KEY_ESTADO(id)) || 'sin'; }
function setEstado(id, v) {
  if (v === 'sin') localStorage.removeItem(KEY_ESTADO(id));
  else localStorage.setItem(KEY_ESTADO(id), v);
}
function getNotas(id) { return localStorage.getItem(KEY_NOTAS(id)) || ''; }
function setNotas(id, v) {
  if (!v) localStorage.removeItem(KEY_NOTAS(id));
  else localStorage.setItem(KEY_NOTAS(id), v);
}

// ============================ Tema (dark/light) ==============================
const html = document.documentElement;
if (localStorage.getItem(KEY_DARK) === '1') html.classList.add('dark');
document.getElementById('btn-dark').addEventListener('click', () => {
  html.classList.toggle('dark');
  localStorage.setItem(KEY_DARK, html.classList.contains('dark') ? '1' : '0');
});

// ============================ Cross-link al dashboard licitaciones ==========
document.getElementById('btn-licitaciones').addEventListener('click', () => {
  window.location.href = '../';
});

// ============================ Mapa Leaflet ===================================
const BBOX_CADIZ = [[35.95, -6.70], [37.10, -5.05]];
const map = L.map('map', {
  zoomControl: true,
  attributionControl: true,
}).fitBounds(BBOX_CADIZ);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

const cluster = L.markerClusterGroup({
  chunkedLoading: true,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  maxClusterRadius: 60,
});
map.addLayer(cluster);

// ============================ Marcadores =====================================
function makeMarker(feature) {
  const p = feature.properties;
  const [lon, lat] = feature.geometry.coordinates;
  const estado = getEstado(p.id);
  const ringClass = estado !== 'sin' ? `ring-${estado}` : '';
  const icon = L.divIcon({
    className: '',
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -15],
    html: `<div class="h-marker h-marker-${p.tipo} ${ringClass}">${TIPO_ICONO_LETRA[p.tipo] || '?'}</div>`,
  });
  const m = L.marker([lat, lon], { icon });
  m.feature = feature;            // L.geoJSON pattern
  m.options.cliente = p;          // referencia rápida
  m.bindPopup(() => popupHTML(p), { maxWidth: 320, autoPanPaddingTopLeft: [10, 80] });
  m.on('popupopen', () => bindPopupEvents(p, m));
  return m;
}

function popupHTML(p) {
  const estado = getEstado(p.id);
  const notas = getNotas(p.id).replace(/</g, '&lt;');
  const tel = p.telefono ? p.telefono.replace(/\s+/g, '') : null;
  const mapsHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.direccion || p.nombre) + ', ' + (p.municipio || ''))}`;
  const etapasHTML = p.etapas
    ? `<div class="flex flex-wrap gap-1 mt-2">${p.etapas.split(',').map(e =>
        `<span class="px-2 py-0.5 text-[10px] rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium">${e}</span>`
      ).join('')}</div>`
    : '';

  return `
    <div class="popup-section">
      <div class="flex items-start justify-between gap-2 mb-1">
        <h3 class="font-semibold text-sm leading-snug">${escapeHtml(p.nombre)}</h3>
        <span class="pill tipo-${p.tipo} pill-on" style="font-size:10px; padding:2px 8px; flex-shrink:0;">${TIPO_LABELS[p.tipo] || p.tipo}</span>
      </div>
      <p class="text-xs text-slate-600 dark:text-slate-400">${escapeHtml([p.direccion, p.municipio, p.cp].filter(Boolean).join(' · '))}</p>
      ${etapasHTML}
    </div>

    <div class="popup-section">
      ${tel ? `
        <a class="contact-row" href="tel:${tel}" title="Llamar">
          <span class="contact-icon contact-icon-tel">📞</span>
          <span class="contact-text">${escapeHtml(p.telefono)}</span>
          <span class="contact-arrow">›</span>
        </a>` : ''}
      ${p.email ? `
        <a class="contact-row" href="mailto:${p.email}" title="Enviar email">
          <span class="contact-icon contact-icon-email">✉️</span>
          <span class="contact-text">${escapeHtml(p.email)}</span>
          <span class="contact-arrow">›</span>
        </a>` : ''}
      ${p.web ? `
        <a class="contact-row" href="${escapeHtml(p.web)}" target="_blank" rel="noopener" title="Abrir web">
          <span class="contact-icon contact-icon-web">🌐</span>
          <span class="contact-text">${escapeHtml(p.web.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</span>
          <span class="contact-arrow">›</span>
        </a>` : ''}
      <a class="contact-row" href="${mapsHref}" target="_blank" rel="noopener" title="Abrir en Google Maps">
        <span class="contact-icon contact-icon-maps">🧭</span>
        <span class="contact-text">Cómo llegar (Google Maps)</span>
        <span class="contact-arrow">›</span>
      </a>
    </div>

    <div class="popup-section">
      <div class="text-[11px] uppercase tracking-wide text-slate-400 mb-2">Estado comercial</div>
      <div class="flex flex-wrap gap-1.5" data-popup-estados="${p.id}">
        ${ESTADOS.map(e => `
          <button data-estado="${e.key}" class="pill ${e.clase} ${e.key === estado ? 'pill-on' : 'pill-off'}" style="font-size:11px; padding:4px 10px;">${e.label}</button>
        `).join('')}
      </div>
    </div>

    <div class="popup-section">
      <div class="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Notas</div>
      <textarea data-popup-notas="${p.id}" rows="2"
        placeholder="Escribe una nota (se guarda en este navegador)…"
        class="w-full text-xs p-2 rounded-md border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 resize-none">${notas}</textarea>
    </div>
  `;
}

function bindPopupEvents(p, marker) {
  // Estados
  const estadoContainer = document.querySelector(`[data-popup-estados="${CSS.escape(p.id)}"]`);
  if (estadoContainer) {
    estadoContainer.querySelectorAll('button[data-estado]').forEach(btn => {
      btn.addEventListener('click', () => {
        const nuevo = btn.dataset.estado;
        setEstado(p.id, nuevo);
        // refrescar UI de los botones
        estadoContainer.querySelectorAll('button[data-estado]').forEach(b => {
          b.classList.toggle('pill-on', b.dataset.estado === nuevo);
          b.classList.toggle('pill-off', b.dataset.estado !== nuevo);
        });
        // refrescar el icono del marker
        refrescarIconoMarker(marker);
        // re-aplicar filtros (podría haber filtro de estado activo)
        aplicarFiltros();
      });
    });
  }
  // Notas
  const notasInput = document.querySelector(`[data-popup-notas="${CSS.escape(p.id)}"]`);
  if (notasInput) {
    let timer;
    notasInput.addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(() => setNotas(p.id, e.target.value), 350);
    });
  }
}

function refrescarIconoMarker(marker) {
  const p = marker.options.cliente;
  const estado = getEstado(p.id);
  const ringClass = estado !== 'sin' ? `ring-${estado}` : '';
  marker.setIcon(L.divIcon({
    className: '',
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -15],
    html: `<div class="h-marker h-marker-${p.tipo} ${ringClass}">${TIPO_ICONO_LETRA[p.tipo] || '?'}</div>`,
  }));
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ============================ Filtros ========================================
const filtrosTipo   = new Set(['colegio_publico', 'colegio_privado', 'guarderia', 'ayuntamiento', 'camping', 'paisajista']);
const filtrosEstado = new Set(['sin', 'contactado', 'oferta', 'cliente']);
// 'descartado' inicialmente OFF

let TODOS_MARKERS = [];

function aplicarFiltros() {
  const texto = document.getElementById('busqueda').value.trim().toLowerCase();
  const visibles = TODOS_MARKERS.filter(m => {
    const p = m.options.cliente;
    if (!filtrosTipo.has(p.tipo)) return false;
    if (!filtrosEstado.has(getEstado(p.id))) return false;
    if (texto) {
      const hay = `${p.nombre} ${p.direccion || ''} ${p.municipio || ''}`.toLowerCase();
      if (!hay.includes(texto)) return false;
    }
    return true;
  });
  cluster.clearLayers();
  cluster.addLayers(visibles);
  document.getElementById('kpi-resumen').textContent = `${visibles.length.toLocaleString('es-ES')} resultados visibles`;
}

document.querySelectorAll('[data-filtro-tipo]').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.filtroTipo;
    if (filtrosTipo.has(t)) { filtrosTipo.delete(t); btn.classList.replace('pill-on', 'pill-off'); }
    else                    { filtrosTipo.add(t);    btn.classList.replace('pill-off', 'pill-on'); }
    aplicarFiltros();
  });
});

document.querySelectorAll('[data-filtro-estado]').forEach(btn => {
  btn.addEventListener('click', () => {
    const e = btn.dataset.filtroEstado;
    if (filtrosEstado.has(e)) { filtrosEstado.delete(e); btn.classList.replace('pill-on', 'pill-off'); }
    else                      { filtrosEstado.add(e);    btn.classList.replace('pill-off', 'pill-on'); }
    aplicarFiltros();
  });
});

let busquedaTimer;
document.getElementById('busqueda').addEventListener('input', () => {
  clearTimeout(busquedaTimer);
  busquedaTimer = setTimeout(aplicarFiltros, 200);
});

// ============================ Geolocalización ================================
let layerUbicacion;
document.getElementById('fab-locate').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Tu navegador no soporta geolocalización.');
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    if (layerUbicacion) map.removeLayer(layerUbicacion);
    layerUbicacion = L.circleMarker([lat, lon], {
      radius: 8, color: '#fff', weight: 3, fillColor: '#0ea5e9', fillOpacity: 1,
    }).addTo(map);
    map.setView([lat, lon], 14);
  }, err => {
    alert('No se pudo obtener tu ubicación: ' + err.message);
  }, { enableHighAccuracy: true, timeout: 8000 });
});

// ============================ Carga inicial =================================
fetch('data/clientes.geojson')
  .then(r => r.json())
  .then(gj => {
    TODOS_MARKERS = gj.features.map(makeMarker);

    // Contadores por tipo (en los chips)
    const counts = {};
    gj.features.forEach(f => { counts[f.properties.tipo] = (counts[f.properties.tipo] || 0) + 1; });
    document.querySelectorAll('[data-count-tipo]').forEach(el => {
      const n = counts[el.dataset.countTipo] || 0;
      el.textContent = n ? `(${n})` : '';
    });

    aplicarFiltros();
  })
  .catch(err => {
    console.error('Error cargando GeoJSON', err);
    document.getElementById('kpi-resumen').textContent = 'Error al cargar datos';
  });
</script>
</body>
</html>
